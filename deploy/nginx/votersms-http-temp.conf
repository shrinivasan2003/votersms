# TEMPORARY plain-HTTP config, serving on the bare server IP while the
# real domain decision is pending. Once a domain is assigned:
#   1. Point its DNS A record at this server
#   2. Replace this file's `server_name` with that domain
#   3. Run certbot to add HTTPS (see the old deployment's nginx config,
#      deploy/ history, or ask — it's a few commands, not a rewrite)
#   4. Delete this file, or repurpose it as the :80 -> :443 redirect block
#
# No credentials or secrets live in this file — safe to commit.

server {
    listen 80;
    listen [::]:80;
    server_name 136.115.17.95;

    root /opt/votersms/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options          "DENY"                                always;
    add_header X-Content-Type-Options   "nosniff"                             always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Port 8002, not 8000 — this host runs several apps; see votersms.service.
    location /api/ {
        proxy_pass         http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
