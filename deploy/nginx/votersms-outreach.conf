# Production config for outreach.ballotda.com.
# This is the LIVE config, pulled from /etc/nginx/sites-enabled/votersms
# after certbot added the SSL block — keep this in sync if it's ever
# edited on the server again.

server {
    server_name outreach.ballotda.com;

    root /opt/votersms/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options          "DENY"                                always;
    add_header X-Content-Type-Options   "nosniff"                             always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Port 8002, not 8000 — this host runs several other apps. See votersms.service.
    location /api/ {
        proxy_pass         http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/outreach.ballotda.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/outreach.ballotda.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = outreach.ballotda.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name outreach.ballotda.com;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot
}
