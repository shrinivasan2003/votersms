# Production config for outreach.ballotda.com.
#
# The HTTPS `listen 443 ssl` block and cert paths are added by
# `certbot --nginx` when the cert is issued — do not hand-write them here.
# This file as committed is the pre-certbot state (HTTP only); after
# certbot runs on the server, pull its modified version back into the
# repo so this file reflects what's actually live.

server {
    server_name outreach.ballotda.com;

    root /opt/votersms/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options          "DENY"                                always;
    add_header X-Content-Type-Options   "nosniff"                             always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Port 8002, not 8000 — this host runs several other apps. See votersms.service.
    location /api/ {
        proxy_pass         http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen 80;
    listen [::]:80;
}
